<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔兽世界时光服1区部落 · 金价走势</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; padding: 16px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 17px; font-weight: 600; color: #f1f5f9; }
  .sub { font-size: 12px; color: #64748b; margin-top: 3px; }
  .cards { display: flex; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .card {
    flex: 1; min-width: 120px; background: #1e293b; border-radius: 10px;
    padding: 10px 12px; border: 1px solid #334155;
  }
  .card .label { font-size: 11px; color: #94a3b8; }
  .card .value { font-size: 20px; font-weight: 700; margin-top: 2px; }
  .card .delta { font-size: 11px; margin-top: 2px; }
  .up { color: #f87171; } .down { color: #4ade80; } .flat { color: #94a3b8; }
  .chart-box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; position: relative; }
  canvas { width: 100%; height: 320px; display: block; cursor: crosshair; }
  #tip {
    position: absolute; display: none; background: rgba(15,23,42,.96);
    border: 1px solid #334155; border-radius: 8px; padding: 7px 11px;
    font-size: 12px; line-height: 1.7; pointer-events: none; z-index: 10;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); white-space: nowrap;
  }
  #tip .t-time { color: #64748b; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: #94a3b8; margin-top: 10px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .foot { font-size: 11px; color: #475569; margin-top: 12px; line-height: 1.7; }
  .err { color: #f87171; font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>魔兽世界时光服 · 1区(时光I PvE) · 部落金价</h1>
  <div class="sub">数据来源：7881 平台 · 每 6 小时自动采集 · 元/万金</div>

  <div class="cards" id="cards"><div class="card">加载中…</div></div>

  <div class="chart-box">
    <canvas id="chart"></canvas>
    <div id="tip"></div>
    <div class="legend">
      <span><i style="background:#3b82f6"></i>售出均价</span>
      <span><i style="background:#eab308"></i>回收最高价</span>
      <span><i style="background:#64748b"></i>实时最低挂单价（底部标注）</span>
    </div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const CSV_URL = "https://raw.githubusercontent.com/Wyao886/wow-gold-price/main/gold_price_history.csv";

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const head = lines[0].split(",");
  const idx = {};
  head.forEach((h, i) => idx[h.trim()] = i);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const c = lines[i].split(",");
    if (c.length < head.length) continue;
    const g = k => (idx[k] !== undefined ? (c[idx[k]] || "").trim() : "");
    const num = v => v === "" ? null : parseFloat(v);
    rows.push({
      dt: g("datetime"),
      min: num(g("min_yuan_per_10k")),
      avg: num(g("avg_yuan_per_10k")) ?? num(g("avg_top10_yuan_per_10k")),
      rec: num(g("recycle_max_yuan_per_10k")),
    });
  }
  return rows.filter(r => r.dt && r.avg !== null);
}

function draw(rows, hover) {
  const cv = document.getElementById("chart");
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const padL = 44, padR = 14, padT = 18, padB = 40;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = rows.length;
  const vals = [];
  rows.forEach(r => { if (r.avg !== null) vals.push(r.avg); if (r.rec !== null) vals.push(r.rec); });
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const span = Math.max(hi - lo, 1);
  lo -= span * 0.12; hi += span * 0.12;
  const X = i => padL + (n === 1 ? iw / 2 : i / (n - 1) * iw);
  const Y = v => padT + (1 - (v - lo) / (hi - lo)) * ih;

  // 网格 + Y轴刻度
  ctx.strokeStyle = "#334155"; ctx.fillStyle = "#64748b";
  ctx.font = "10px sans-serif"; ctx.lineWidth = 1;
  for (let g = 0; g <= 4; g++) {
    const v = lo + (hi - lo) * g / 4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    ctx.textAlign = "right"; ctx.fillText(v.toFixed(1), padL - 6, y + 3);
  }
  // X轴：日期标签（最多6个）
  ctx.textAlign = "center";
  const step = Math.max(1, Math.ceil(n / 6));
  for (let i = 0; i < n; i += step) {
    ctx.fillText(rows[i].dt.slice(5, 16), X(i), H - padB + 16);
  }

  // 回收价（黄）
  const recPts = rows.map((r, i) => r.rec !== null ? [X(i), Y(r.rec)] : null).filter(Boolean);
  if (recPts.length > 1) {
    ctx.strokeStyle = "#eab308"; ctx.lineWidth = 2; ctx.beginPath();
    recPts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.stroke();
    ctx.fillStyle = "#eab308";
    recPts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 2.5, 0, 7); ctx.fill(); });
  }

  // 售出均价（蓝）
  ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2.5; ctx.beginPath();
  rows.forEach((r, i) => { const x = X(i), y = Y(r.avg); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  ctx.stroke();
  ctx.fillStyle = "#3b82f6";
  rows.forEach((r, i) => { ctx.beginPath(); ctx.arc(X(i), Y(r.avg), 3, 0, 7); ctx.fill(); });

  // 最新点数值标注
  const last = rows[n - 1];
  ctx.fillStyle = "#93c5fd"; ctx.textAlign = "left"; ctx.font = "bold 11px sans-serif";
  ctx.fillText(last.avg.toFixed(2), Math.min(X(n - 1) + 6, W - 46), Y(last.avg) - 6);

  // 实时最低挂单价：底部标注
  const mins = rows.map((r, i) => r.min !== null ? [X(i), r.min, r.dt] : null).filter(Boolean);
  if (mins.length) {
    const [lx, lmin, ldt] = mins[mins.length - 1];
    ctx.fillStyle = "#94a3b8"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
    ctx.fillText(`实时最低挂单价 ${lmin.toFixed(2)} 元/万金（${ldt.slice(5, 16)}）`, padL, H - 6);
    ctx.strokeStyle = "#64748b"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, Y(lmin)); ctx.lineTo(W - padR, Y(lmin)); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 悬停十字线 + 高亮圈
  if (hover != null && rows[hover]) {
    const hx = X(hover), r = rows[hover];
    ctx.strokeStyle = "#475569"; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(hx, padT); ctx.lineTo(hx, H - padB); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1.5;
    if (r.avg !== null) {
      ctx.strokeStyle = "#3b82f6";
      ctx.beginPath(); ctx.arc(hx, Y(r.avg), 6, 0, 7); ctx.stroke();
    }
    if (r.rec !== null) {
      ctx.strokeStyle = "#eab308";
      ctx.beginPath(); ctx.arc(hx, Y(r.rec), 6, 0, 7); ctx.stroke();
    }
  }
}

function cards(rows) {
  const last = rows[rows.length - 1], prev = rows.length > 1 ? rows[rows.length - 2] : null;
  const chg = prev ? ((last.avg - prev.avg) / prev.avg * 100) : 0;
  const cls = chg > 0.05 ? "up" : chg < -0.05 ? "down" : "flat";
  const arrow = chg > 0.05 ? "▲" : chg < -0.05 ? "▼" : "—";
  const recChg = prev && prev.rec !== null && last.rec !== null ? ((last.rec - prev.rec) / prev.rec * 100) : 0;
  const rcls = recChg > 0.05 ? "up" : recChg < -0.05 ? "down" : "flat";
  document.getElementById("cards").innerHTML = `
    <div class="card"><div class="label">售出均价</div>
      <div class="value" style="color:#93c5fd">${last.avg.toFixed(2)}</div>
      <div class="delta ${cls}">${arrow} ${Math.abs(chg).toFixed(2)}%（较上次采集）</div></div>
    <div class="card"><div class="label">回收最高价</div>
      <div class="value" style="color:#fde047">${last.rec !== null ? last.rec.toFixed(2) : "—"}</div>
      <div class="delta ${rcls}">${last.rec !== null && prev && prev.rec !== null ? (recChg > 0.05 ? "▲" : recChg < -0.05 ? "▼" : "—") + " " + Math.abs(recChg).toFixed(2) + "%" : ""}</div></div>
    <div class="card"><div class="label">实时最低挂单价</div>
      <div class="value">${last.min !== null ? last.min.toFixed(2) : "—"}</div>
      <div class="delta flat">采集于 ${last.dt.slice(5, 16)}</div></div>`;
  document.getElementById("foot").innerHTML =
    `共 ${rows.length} 条历史记录 · 最新采集 ${last.dt} · 每天 07:09 / 12:09 / 18:09 自动更新（北京时间）`;
}

fetch(CSV_URL + "?t=" + Date.now())
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
  .then(text => {
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error("数据不足");
    cards(rows);

    // 鼠标悬停：十字线 + 当时价格提示框
    const cv = document.getElementById("chart");
    const tip = document.getElementById("tip");
    let hoverIdx = null;
    const render = () => draw(rows, hoverIdx);
    cv.addEventListener("mousemove", e => {
      const rect = cv.getBoundingClientRect();
      const padL = 44, padR = 14;
      const iw = rect.width - padL - padR;
      const n = rows.length;
      let i = Math.round((e.clientX - rect.left - padL) / (iw || 1) * (n - 1));
      i = Math.max(0, Math.min(n - 1, i));
      if (i !== hoverIdx) { hoverIdx = i; render(); }
      const r = rows[i];
      tip.innerHTML = `<div class="t-time">${r.dt}</div>` +
        (r.avg !== null ? `<div><span style="color:#3b82f6;">●</span> 售出均价 <b>${r.avg.toFixed(2)}</b></div>` : "") +
        (r.rec !== null ? `<div><span style="color:#eab308;">●</span> 回收最高 <b>${r.rec.toFixed(2)}</b></div>` : "") +
        (r.min !== null ? `<div><span style="color:#64748b;">●</span> 最低挂单 <b>${r.min.toFixed(2)}</b></div>` : "");
      tip.style.display = "block";
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      let tx = e.clientX - rect.left + 14;
      let ty = e.clientY - rect.top - th / 2;
      if (tx + tw > rect.width - 2) tx = e.clientX - rect.left - tw - 14;
      if (ty + th > rect.height) ty = rect.height - th - 2;
      if (ty < 0) ty = 0;
      tip.style.left = tx + "px";
      tip.style.top = ty + "px";
    });
    cv.addEventListener("mouseleave", () => { hoverIdx = null; tip.style.display = "none"; render(); });
    window.addEventListener("resize", render);
    render();
  })
  .catch(e => {
    document.getElementById("cards").innerHTML =
      `<div class="err">数据加载失败：${e.message}<br>请检查网络后刷新（仓库为私有时本页无法直接读取）</div>`;
  });
</script>
</body>
</html>
