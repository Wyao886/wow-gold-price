name: Gold Price Collector

on:
  schedule:
    # UTC 时间：04:09 / 10:09 / 23:09 → 北京时间 12:09 / 18:09 / 次日 07:09
    - cron: "9 4,10,23 * * *"
  workflow_dispatch:  # 允许手动触发（Actions 页面 → Run workflow）

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect gold price
        run: python gold_cloud.py

      - name: Commit and push if changed
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add gold_price_history.csv
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "gold: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
